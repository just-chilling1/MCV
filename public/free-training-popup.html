  <script>
    (function () {
      var COUNTDOWN_SECONDS = 10 * 60;
      var secondsLeft = COUNTDOWN_SECONDS;
      var cd = document.getElementById("cd");
      var closed = false;

      function notifyParent() {
        try {
          window.parent.postMessage({ type: "free-training-popup-closed", source: "blackboxcash" }, "*");
        } catch (e) {}
      }

      function closePopup() {
        if (closed) return;
        closed = true;
        document.body.classList.add("closed");
        notifyParent();
      }

      document.getElementById("closeBtn").addEventListener("click", closePopup);

      var tick = setInterval(function () {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          clearInterval(tick);
          cd.textContent = "0:00";
          closePopup();
          return;
        }
        var m = Math.floor(secondsLeft / 60);
        var s = String(secondsLeft % 60).padStart(2, "0");
        cd.textContent = m + ":" + s;
      }, 1000);

      function appendPlayerScript() {
        var script = document.createElement("script");
        script.src = "https://scripts.converteai.net/e9cd97bc-7bc8-4a23-bb2f-224a56a84d6b/players/6a723793e82132383c2edc33/v4/player.js";
        script.async = true;
        script.dataset.vturbPlayer = "vid-6a723793e82132383c2edc33";
        document.head.appendChild(script);
      }

      function mountVturbPlayer() {
        document
          .querySelectorAll('script[data-vturb-player="vid-6a723793e82132383c2edc33"]')
          .forEach(function (node) {
            node.remove();
          });
        window.requestAnimationFrame(appendPlayerScript);
      }

      function fitVturbPlayer() {
        if (window.innerWidth < 768) return;
        var shell = document.querySelector(".video-col");
        var host = document.getElementById("videoHost");
        var player = host ? host.querySelector("vturb-smartplayer") : null;
        if (!shell || !host || !player) return;
        var shellHeight = shell.clientHeight;
        var shellWidth = host.clientWidth;
        if (shellHeight < 1 || shellWidth < 1) return;
        var ratio = 16 / 9;
        var width = shellWidth;
        var height = width / ratio;
        if (height > shellHeight) {
          height = shellHeight;
          width = height * ratio;
        }
        player.style.width = Math.floor(width) + "px";
        player.style.height = Math.floor(height) + "px";
        player.style.maxWidth = "100%";
        player.style.maxHeight = "100%";
        host.querySelectorAll(".vturb-player-placeholder, iframe, video").forEach(function (node) {
          node.style.paddingTop = "0";
          node.style.width = "100%";
          node.style.height = "100%";
          if (node.tagName === "VIDEO") node.style.objectFit = "cover";
        });
      }

      function watchVturbPlayer() {
        fitVturbPlayer();
        var host = document.getElementById("videoHost");
        if (!host) return;
        var observer = new MutationObserver(fitVturbPlayer);
        observer.observe(host, { childList: true, subtree: true, attributes: true });
        window.addEventListener("resize", fitVturbPlayer);
        var poll = setInterval(fitVturbPlayer, 400);
        setTimeout(function () { clearInterval(poll); }, 10000);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", mountVturbPlayer);
      } else {
        mountVturbPlayer();
      }
      watchVturbPlayer();
    })();
  </script>
